<!DOCTYPE html>
<html lang="it" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="author" content="Team di design Lotrek" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:locale" content="it_IT" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="assets/lotrek-favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="preload" href="assets/fonts/Ronzino-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Ronzino-Bold.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    /* ---------- Ronzino — Collletttivo, SIL OFL 1.1 (assets/fonts/OFL.txt) ---------- */
    /* Self-hosted: la famiglia ha 400 / 500 / 700 + obliqui, niente 600. */
    @font-face {
      font-family: "Ronzino"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("assets/fonts/Ronzino-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Ronzino"; font-style: italic; font-weight: 400; font-display: swap;
      src: url("assets/fonts/Ronzino-Oblique.woff2") format("woff2");
    }
    @font-face {
      font-family: "Ronzino"; font-style: normal; font-weight: 500; font-display: swap;
      src: url("assets/fonts/Ronzino-Medium.woff2") format("woff2");
    }
    @font-face {
      font-family: "Ronzino"; font-style: italic; font-weight: 500; font-display: swap;
      src: url("assets/fonts/Ronzino-MediumOblique.woff2") format("woff2");
    }
    @font-face {
      font-family: "Ronzino"; font-style: normal; font-weight: 700; font-display: swap;
      src: url("assets/fonts/Ronzino-Bold.woff2") format("woff2");
    }
    @font-face {
      font-family: "Ronzino"; font-style: italic; font-weight: 700; font-display: swap;
      src: url("assets/fonts/Ronzino-BoldOblique.woff2") format("woff2");
    }

    :root {
      --bg: #f5f5f5;          /* colonna di lettura */
      --bg-chrome: #eeeeef;   /* topbar e spalla: un gradino sotto */
      --surface: #ffffff;
      --surface-2: #fbfbfb;
      --ink: #181818;
      --ink-soft: #44464c;
      --muted: #707378;
      --border: #e5e5e6;
      --border-strong: #d4d4d6;
      --accent: #d9fb12;
      --accent-ink: #181818;
      --accent-wash: #edf5b1;
      --accent-line: #c3e400;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);

      --font-display: "Ronzino", ui-sans-serif, system-ui, sans-serif;
      --font-serif: "Ronzino", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      /* Ronzino non ha il 600: i pesi "semibold" del vecchio Instrument Sans
         sono riassegnati esplicitamente a Medium (UI) e Bold (titoli/enfasi). */
      --w-medium: 500;
      --w-bold: 700;

      --sidebar-w: 310px;
      --content-max: 74ch;
      --radius: 16px;
      --radius-sm: 8px;
    }

    :root[data-theme="dark"] {
      --bg: #0c1a1f;
      --bg-chrome: #08151a;
      --surface: #10242b;
      --surface-2: #0f2027;
      --ink: #f3f4f2;
      --ink-soft: #d4d4d6;
      --muted: #8b9599;
      --border: #1e343c;
      --border-strong: #2a454e;
      --accent: #d9fb12;
      --accent-ink: #0c1a1f;
      --accent-wash: rgba(217,251,18,.12);
      --accent-line: #d9fb12;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] {
        --bg: #0c1a1f;
        --bg-chrome: #08151a;
        --surface: #10242b;
        --surface-2: #0f2027;
        --ink: #f3f4f2;
        --ink-soft: #d4d4d6;
        --muted: #8b9599;
        --border: #1e343c;
        --border-strong: #2a454e;
        --accent: #d9fb12;
        --accent-ink: #0c1a1f;
        --accent-wash: rgba(217,251,18,.12);
        --accent-line: #d9fb12;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }

    /* ---------- Scroll progress ---------- */
    #progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 100%;
      transform: scaleX(0); transform-origin: 0 50%;
      background: var(--accent); z-index: 100; transition: transform .1s linear;
    }
    @media (prefers-reduced-motion: reduce) { #progress { transition: none; } }

    /* ---------- Top bar ---------- */
    header.topbar {
      position: sticky; top: 0; z-index: 50;
      height: 60px; display: flex; align-items: center; gap: 16px;
      padding: 0 22px;
      background: color-mix(in srgb, var(--bg-chrome) 84%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; text-decoration: none; }
    .brand-logo { height: 32px; width: auto; display: block; }
    .brand-logo--dark { display: none; }
    :root[data-theme="dark"] .brand-logo--light { display: none; }
    :root[data-theme="dark"] .brand-logo--dark { display: block; }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] .brand-logo--light { display: none; }
      :root[data-theme="auto"] .brand-logo--dark { display: block; }
    }
    .topbar .spacer { flex: 1; }

    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--ink); cursor: pointer; font-size: 16px; line-height: 1;
      transition: transform .12s ease, background .2s ease, border-color .2s ease;
    }
    .iconbtn .ico { width: 18px; height: 18px; display: block; }
    .iconbtn:hover { border-color: var(--ink-soft); }
    .iconbtn:active { transform: translateY(1px); }
    #menuBtn { display: none; }

    /* ---------- Layout ---------- */
    .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

    /* ---------- Sidebar / TOC ---------- */
    aside.toc {
      position: sticky; top: 60px; align-self: start;
      height: calc(100vh - 60px); overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--bg-chrome);
      padding: 26px 18px 60px 26px;
      font-family: var(--font-display);
    }
    aside.toc .toc-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .16em;
      color: var(--muted); font-weight: var(--w-bold); margin: 0 0 14px 6px;
    }
    aside.toc nav { display: flex; flex-direction: column; gap: 2px; }

    /* Accordion group: macro-voce (H2) + sotto-lista (H3) collassabile */
    .toc-group + .toc-group { margin-top: 4px; }
    .toc-macro {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--ink);
      font-weight: var(--w-medium); font-size: 14.5px; line-height: 1.3;
      border-radius: 8px; padding: 8px 10px; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .toc-macro:hover { background: var(--accent-wash); }
    .toc-macro .toc-macro-text { flex: 1; min-width: 0; }
    .toc-macro.active { background: var(--accent-wash); }
    .toc-chev { flex: none; color: var(--muted); transition: transform .22s ease; }
    .toc-group.open > .toc-macro .toc-chev { transform: rotate(90deg); }
    .toc-group.open > .toc-macro { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) { .toc-chev { transition: none; } }

    /* Sotto-lista: animazione altezza via grid-template-rows (0fr -> 1fr) */
    .toc-sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
    .toc-group.open > .toc-sub { grid-template-rows: 1fr; }
    @media (prefers-reduced-motion: reduce) { .toc-sub { transition: none; } }
    .toc-sub-inner { overflow: hidden; min-height: 0; }

    aside.toc a.lvl-3 {
      text-decoration: none; color: var(--ink-soft);
      border-radius: 8px; padding: 6px 10px 6px 20px; margin-left: 12px;
      display: block; font-size: 14px; line-height: 1.35;
      transition: background .15s ease, color .15s ease;
    }
    aside.toc a.lvl-3:hover { background: var(--accent-wash); color: var(--ink); }
    aside.toc a.lvl-3.active { color: var(--ink); background: var(--accent-wash); }
    aside.toc a.flag::before {
      content: ""; display: inline-block; vertical-align: middle;
      width: 6px; height: 6px; margin-right: 8px; border-radius: 50%;
      background: var(--accent-line);
    }

    /* ---------- Main ---------- */
    main { padding: 0 6vw 120px; min-width: 0; }
    .prose { max-width: var(--content-max); margin: 0 auto; }

    /* Hero */
    .hero { padding: 64px 0 40px; margin-bottom: 40px; }
    .hero .eyebrow {
      font-family: var(--font-display); font-size: 12px; font-weight: var(--w-bold);
      text-transform: uppercase; letter-spacing: .18em; color: var(--muted);
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }
    .hero h1 {
      font-family: var(--font-display); font-weight: var(--w-bold);
      font-size: clamp(2.1rem, 4.6vw, 3.3rem); line-height: 1.04;
      letter-spacing: -.025em; margin: 0 0 2rem;
    }
    .hero .lede { font-size: 1.16rem; color: var(--ink-soft); }
    .hero .lede :first-child { margin-top: 0; }
    .hero .lede :last-child { margin-bottom: 0; }
    .hero .lede strong { color: var(--ink); }

    /* Typographic rhythm */
    /* ---------- Ritmo verticale ----------
       Due regole, entrambe su multipli di 8px e in rem, così lo spazio non
       dipende dal corpo del titolo (il vecchio margine in em sull'occhiello
       valeva 3 × 12px = 36px, e dava a un capitolo meno aria di una sezione).

       1. Lo spazio SOPRA un titolo cresce col livello:
          capitolo 128px · sezione 56px · sotto-sezione 32px
          (il capitolo stacca il doppio: fra i capitoli non c'è più un filetto)
       2. Lo spazio SOTTO è sempre molto minore, circa metà del corpo del
          titolo, così questo appartiene al testo che introduce:
          h1 32px · h2 16px · h3 12px · h4 8px
          (l'h1 ne vuole di più: line-height 1.04 gli toglie spazio ottico)
       Paragrafo 20px, filetto di chiusura capitolo 48px.                    */
    :root {
      --gap-cap: 8rem;    /* 128px — sopra un capitolo  */
      --gap-sez: 3.5rem;  /* 56px — sopra una sezione   */
      --gap-sub: 2rem;    /* 32px — sopra un h4         */
    }
    .prose h2 {
      font-family: var(--font-display); font-weight: var(--w-bold);
      font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.12;
      letter-spacing: -.02em; margin: var(--gap-cap) 0 1.5rem;
      padding-bottom: 1rem; border-bottom: 1.5px solid var(--ink);
    }
    /* Occhiello "Capitolo N" sopra l'attacco di sezione */
    .prose .chapter-kicker {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--font-display); font-size: 12px; font-weight: var(--w-bold);
      text-transform: uppercase; letter-spacing: .15em; color: var(--muted);
      margin: var(--gap-cap) 0 0;
    }
    .prose .chapter-kicker + h2.has-kicker { margin-top: .5rem; }
    .prose .hero + .chapter-kicker { margin-top: var(--gap-sez); }
    .prose h2.has-kicker { scroll-margin-top: 108px; }
    /* Scala: 18 (corpo) · 20 (h4) · 24 (h3) · 33.6 (h2) · 52.8 (h1) — rapporti
       crescenti 1.11 / 1.20 / 1.40 / 1.57. L'h4 stava sotto al corpo e l'h3 a
       ridosso (1.14): il gradino intermedio mancava del tutto. */
    .prose h3 {
      font-family: var(--font-display); font-weight: var(--w-bold);
      font-size: 1.5rem; letter-spacing: -.015em; line-height: 1.25;
      margin: var(--gap-sez) 0 .75rem; scroll-margin-top: 84px;
    }
    .prose h2 { scroll-margin-top: 76px; }
    .prose h4 {
      font-family: var(--font-display); font-weight: var(--w-bold);
      font-size: 1.25rem; line-height: 1.35; margin: var(--gap-sub) 0 .5rem;
    }
    .prose h3 .badge {
      display: inline-block; vertical-align: middle; transform: translateY(-.1em);
      margin-left: .55em; font-family: var(--font-display);
      font-size: .58em; font-weight: var(--w-bold); line-height: 1;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--accent-ink); background: var(--accent);
      padding: .35em .62em; border-radius: 999px;
    }

    .prose p { margin: 0 0 1.25rem; }
    .prose strong { font-weight: var(--w-bold); }
    /* Link: sottolineatura come gradiente, non come text-decoration, perché solo
       così si anima. Il gesto è quello di termecomano.com: a riposo il filetto è
       ancorato a sinistra e pieno; all'hover l'ancora salta a destra (il salto è
       istantaneo, la transizione corre solo su background-size) e la larghezza va
       a zero, quindi si ritira verso destra. All'uscita l'ancora torna a sinistra
       e ricresce da lì. `box-decoration-break: clone` fa sì che un link andato a
       capo abbia il filetto su ogni riga. Il testo è già Medium a riposo, così il
       peso non cambia all'hover e il testo attorno non si sposta. */
    .prose a[href] {
      color: var(--ink); text-decoration: none;
      font-weight: var(--w-medium);
      padding-bottom: 4px;
      background-image: linear-gradient(var(--accent-line), var(--accent-line));
      background-size: 100% 2px;
      background-position: 0 100%;
      background-repeat: no-repeat;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background-size .36s cubic-bezier(.4, 0, .2, 1);
    }
    .prose a[href]:hover,
    .prose a[href]:focus-visible {
      background-size: 0 2px;
      background-position: 100% 100%;
    }
    @media (prefers-reduced-motion: reduce) { .prose a[href] { transition: none; } }
    /* In alto contrasto i background spariscono: serve la sottolineatura vera. */
    @media (forced-colors: active) { .prose a[href] { text-decoration: underline; } }

    .prose ul { margin: 0 0 1.15em; padding-left: 1.4em; }
    .prose li { margin: .35em 0; }
    .prose ul li::marker { color: var(--muted); }

    /* Numerazione: pallino pieno col numero dentro. Inchiostro e non lime,
       perché il lime è l'accento raro del brand e qui i numeri sono decine. */
    .prose ol {
      margin: 0 0 1.15em; padding-left: 0;
      list-style: none; counter-reset: step;
    }
    .prose ol > li { counter-increment: step; position: relative; padding-left: 2em; }
    .prose ol > li::before { content: counter(step); }
    .prose .step { position: absolute; left: 0; top: .1em; }
    .prose ol > li::before, .prose .step {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.7em; height: 1.7em; border-radius: 50%; flex: none;
      background: var(--ink); color: var(--bg);
      font-family: var(--font-display); font-size: .78em; font-weight: var(--w-bold);
      line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums;
    }
    .prose ol > li::before { position: absolute; left: 0; top: .18em; }
    .prose p.has-step { position: relative; padding-left: 2em; }
    .prose p.has-step + pre, .prose p.has-step + .table-wrap { margin-left: 2em; }

    /* Blockquote */
    .prose blockquote {
      margin: 1.6em 0; padding: 2px 0 2px 20px;
      border-left: 1px solid var(--border-strong);
      color: var(--muted); font-style: italic;
    }
    .prose blockquote p:last-child { margin-bottom: 0; }

    /* Inline code + code blocks */
    .prose :not(pre) > code {
      font-family: var(--font-mono); font-size: .86em;
      background: var(--accent-wash); color: var(--ink);
      padding: .12em .38em; border-radius: 5px;
      border: 1px solid color-mix(in srgb, var(--accent-line) 30%, transparent);
    }
    /* Il chip di code ha .38em di padding a destra: senza correzione un due punti
       che lo segue si legge come "`file.md` :". Generato in build.mjs. */
    .prose .tight-punct { margin-left: -.16em; }
    .prose pre {
      font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; overflow-x: auto; margin: 1.5em 0;
      box-shadow: var(--shadow);
    }
    .prose pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 1.6em 0; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .prose table { border-collapse: collapse; width: 100%; font-family: var(--font-display); font-size: 14.5px; background: var(--surface); }
    .prose th, .prose td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .prose thead th { background: var(--surface-2); font-weight: var(--w-medium); letter-spacing: -.01em; position: sticky; top: 0; }
    .prose tbody tr:last-child td { border-bottom: 0; }
    .prose td code, .prose th code { white-space: nowrap; }

    .prose hr { border: 0; border-top: 1px solid var(--border); margin: 3rem 0; }
    .prose img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }

    /* Section anchor on hover */
    .prose h2, .prose h3 { position: relative; }
    .anchor { position: absolute; left: -1.1em; top: 0; opacity: 0; text-decoration: none; color: var(--muted); font-family: var(--font-mono); font-size: .8em; }
    .prose h2:hover .anchor, .prose h3:hover .anchor { opacity: 1; }

    /* Comandi sul titolo: copia la sezione in markdown, copia il link.
       Compaiono in hover come l'ancora, così a riposo la pagina resta pulita. */
    .head-tools {
      display: inline-flex; gap: 2px; margin-left: 10px;
      vertical-align: middle; opacity: 0; transition: opacity .15s ease;
    }
    .prose h2:hover .head-tools, .prose h3:hover .head-tools,
    .head-tools:focus-within { opacity: 1; }
    @media (hover: none) { .head-tools { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .head-tools { transition: none; } }
    .head-tool {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 8px; background: none; cursor: pointer;
      color: var(--muted); transition: background .15s ease, color .15s ease;
    }
    .head-tool:hover { background: var(--accent-wash); color: var(--ink); }
    .head-tool:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
    .head-tool .ico { width: 16px; height: 16px; display: block; }
    .head-tool .ico-ok { display: none; color: var(--accent-line); }
    .head-tool.ok .ico:not(.ico-ok) { display: none; }
    .head-tool.ok .ico-ok { display: block; }

    /* Footer */
    footer.pagefoot {
      margin: 60px 0 0; padding-top: 24px;
      border-top: 1px solid var(--border); color: var(--muted);
      font-family: var(--font-display); font-size: 13px;
      display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between;
    }

    /* Mobile drawer scrim */
    #scrim { display: none; position: fixed; inset: 60px 0 0; background: rgba(0,0,0,.4); z-index: 40; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .shell { grid-template-columns: 1fr; }
      #menuBtn { display: inline-flex; }
      aside.toc {
        position: fixed; top: 60px; left: 0; z-index: 45;
        width: min(88vw, 340px); height: calc(100vh - 60px);
        background: var(--bg); transform: translateX(-105%);
        transition: transform .25s ease; border-right: 1px solid var(--border);
      }
      aside.toc.open { transform: translateX(0); box-shadow: var(--shadow); }
      #scrim.show { display: block; }
      main { padding: 0 24px 100px; }
    }
    @media (prefers-reduced-motion: reduce) { aside.toc { transition: none; } }
    @media (max-width: 560px) {
      body { font-size: 16.5px; }
      main { padding: 0 18px 80px; }
      .hero { padding: 40px 0 32px; }
    }
  </style>
</head>
<body>
  <div id="progress"></div>

  <!-- Sprite icone Lucide (lucide.dev, ISC): copy, link, check -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
    </symbol>
    <symbol id="ico-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </symbol>
    <symbol id="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </symbol>
    <symbol id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </symbol>
    <symbol id="ico-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
    </symbol>
    <symbol id="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>
    </symbol>
  </svg>

  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="Apri l'indice" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#ico-menu"/></svg></button>
    <a class="brand" href="#top" aria-label="Lotrek · KB Design AI">
      <img class="brand-logo brand-logo--light" src="assets/lotrek-logo-positive.svg" alt="Lotrek" width="108" height="32" />
      <img class="brand-logo brand-logo--dark" src="assets/lotrek-logo-negative.svg" alt="Lotrek" width="108" height="32" />
    </a>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" aria-label="Cambia tema" title="Tema: automatico"><svg class="ico" aria-hidden="true"><use href="#ico-monitor"/></svg></button>
  </header>

  <div class="shell">
    <aside class="toc" id="toc" aria-label="Indice della guida">
      <p class="toc-label">Indice</p>
      <nav>{{TOC}}</nav>
    </aside>

    <main>
      <div id="scrim"></div>
      <div class="prose" id="top">
        <section class="hero">
          <span class="eyebrow">Knowledge base per il team di design</span>
          <h1>{{HERO_TITLE}}</h1>
          <div class="lede">{{INTRO}}</div>
        </section>

        {{CONTENT}}

        <!-- Dentro .prose e senza max-width propria: `--content-max` è in `ch`,
             che si calcola sul corpo dell'elemento, e a 13px darebbe una colonna
             molto più stretta del testo. Ereditando, il filetto resta allineato. -->
        <footer class="pagefoot">
          <span>Aggiornato il {{BUILD_DATE}}</span>
          <span>Per domande o considerazioni, scrivi a <a href="mailto:design@lotrek.it">design@lotrek.it</a></span>
        </footer>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // ---- Theme toggle (auto -> light -> dark -> auto) ----
      var root = document.documentElement;
      var saved = localStorage.getItem("kb-theme");
      if (saved) root.setAttribute("data-theme", saved);
      var btn = document.getElementById("themeBtn");
      var order = ["auto", "light", "dark"];
      var icon = { auto: "#ico-monitor", light: "#ico-sun", dark: "#ico-moon" };
      var label = { auto: "automatico", light: "chiaro", dark: "scuro" };
      function render() {
        var mode = root.getAttribute("data-theme") || "auto";
        btn.innerHTML = '<svg class="ico" aria-hidden="true"><use href="' + (icon[mode] || icon.auto) + '"/></svg>';
        btn.title = "Tema: " + (label[mode] || label.auto);
      }
      render();
      btn.addEventListener("click", function () {
        var cur = root.getAttribute("data-theme") || "auto";
        var next = order[(order.indexOf(cur) + 1) % order.length];
        root.setAttribute("data-theme", next);
        localStorage.setItem("kb-theme", next);
        render();
      });

      // ---- Mobile drawer ----
      var toc = document.getElementById("toc");
      var scrim = document.getElementById("scrim");
      var menu = document.getElementById("menuBtn");
      function closeDrawer() { toc.classList.remove("open"); scrim.classList.remove("show"); menu.setAttribute("aria-expanded", "false"); }
      menu.addEventListener("click", function () {
        var open = toc.classList.toggle("open");
        scrim.classList.toggle("show", open);
        menu.setAttribute("aria-expanded", open ? "true" : "false");
      });
      scrim.addEventListener("click", closeDrawer);

      // ---- TOC accordion (single-open) ----
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var nav = toc.querySelector("nav");
      var groups = Array.prototype.slice.call(nav.querySelectorAll(".toc-group"));
      var pinned = null;     // link cliccato: comanda lui finché lo scroll non è atterrato

      function openGroup(group) {
        groups.forEach(function (g) {
          var on = (g === group);
          g.classList.toggle("open", on);
          var m = g.querySelector(".toc-macro");
          if (m && m.hasAttribute("aria-expanded")) m.setAttribute("aria-expanded", on ? "true" : "false");
        });
      }
      var firstWithSubs = groups.filter(function (g) { return g.querySelector(".toc-sub"); })[0];
      if (firstWithSubs) openGroup(firstWithSubs); // primo capitolo aperto di default

      // Scorre SOLO la spalla per tenere visibile il link attivo (non tocca mai la finestra:
      // così non interrompe lo smooth-scroll della pagina — il bug "si blocca prima" su Chrome).
      function keepLinkVisible(a) {
        var cr = toc.getBoundingClientRect();
        var ar = a.getBoundingClientRect();
        if (ar.top < cr.top + 10) toc.scrollTop -= (cr.top + 10 - ar.top);
        else if (ar.bottom > cr.bottom - 10) toc.scrollTop += (ar.bottom - (cr.bottom - 10));
      }

      function goTo(id) {
        var el = document.getElementById(id);
        if (!el) return;
        pin(map[id]); // prima di muovere la pagina, così lo scrollspy non parte per la tangente
        el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
        if (history.replaceState) history.replaceState(null, "", "#" + id);
      }

      nav.addEventListener("click", function (e) {
        var a = e.target.closest("a");
        if (!a) return;
        e.preventDefault();
        var id = a.getAttribute("href").slice(1);
        if (a.classList.contains("toc-macro")) {
          if (id !== "top") openGroup(a.closest(".toc-group")); // apre questa, chiude le altre
          goTo(id);
          if (a.classList.contains("toc-macro--leaf")) closeDrawer(); // Glossario/Fonti: nessuna sotto-voce
        } else {
          var pg = a.closest(".toc-group");
          if (pg) openGroup(pg);
          goTo(id);
          closeDrawer(); // su mobile, scelta una sotto-voce si chiude il drawer
        }
      });

      // ---- Scroll progress ----
      var bar = document.getElementById("progress");
      function onScroll() {
        var h = document.documentElement;
        var max = h.scrollHeight - h.clientHeight;
        bar.style.transform = "scaleX(" + (max > 0 ? h.scrollTop / max : 0) + ")";
      }
      document.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      // ---- Scrollspy ----
      // Attivo = ultimo titolo il cui bordo superiore ha oltrepassato la propria linea di
      // aggancio. La linea NON è una costante: è il punto esatto in cui il browser parcheggia
      // quel titolo dopo un salto d'ancora, cioè lo scroll-padding-top dell'html più lo
      // scroll-margin-top del titolo (76px per gli h2, 108px con kicker, 84px per gli h3).
      // Con una costante sola il titolo atterrava sempre sotto la linea e la spalla illuminava
      // la sezione precedente a ogni click.
      var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
      var map = {};
      links.forEach(function (a) { map[a.getAttribute("href").slice(1)] = a; });
      var heads = Array.prototype.slice.call(document.querySelectorAll(".prose h2[id], .prose h3[id]"));
      var current = null;
      var spyTicking = false;

      function readLine(h) {
        var pad = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
        return pad + (parseFloat(getComputedStyle(h).scrollMarginTop) || 0);
      }
      var lines = heads.map(readLine);
      addEventListener("resize", function () { lines = heads.map(readLine); }, { passive: true });

      function setActive(a, force) {
        if (!a) return;
        if (a !== current) {
          if (current) current.classList.remove("active");
          a.classList.add("active");
          current = a;
        }
        if (!force && pinned) return; // durante un salto l'accordion non insegue la lettura
        var g = a.getAttribute("href") === "#top" ? null : a.closest(".toc-group");
        if (g && !g.classList.contains("open")) openGroup(g);
        keepLinkVisible(a);
      }

      function updateSpy() {
        spyTicking = false;
        if (pinned) return; // lo scroll è in volo verso un bersaglio noto: nessuno lo tocchi
        var active = null;
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top - lines[i] <= 1) active = heads[i];
          else break; // heads è in ordine di documento: oltre il primo non ancora passato, stop
        }
        // sopra il primo titolo si sta leggendo l'apertura
        setActive(active ? map[active.id] : map["top"]);
      }

      // Un click aggancia la voce cliccata e la tiene finché la pagina non è atterrata. La
      // durata di uno smooth scroll dipende dalla distanza (misurata fino a 1,6s su questa
      // pagina), quindi si aspetta l'evento di fine scroll invece di indovinare un timeout.
      var pinTimer = null;
      function releasePin() {
        if (!pinned) return;
        pinned = null;
        if (pinTimer) { clearTimeout(pinTimer); pinTimer = null; }
        updateSpy(); // riallinea con dove siamo davvero finiti
      }
      function pin(a) {
        if (!a) return;
        pinned = a;
        setActive(a, true);
        if (pinTimer) clearTimeout(pinTimer);
        pinTimer = setTimeout(releasePin, 3000); // rete di sicurezza se scrollend non arriva
      }
      document.addEventListener("scrollend", releasePin);
      // se nel frattempo l'utente scorre a mano, comanda lui
      ["wheel", "touchstart", "keydown"].forEach(function (ev) {
        document.addEventListener(ev, releasePin, { passive: true });
      });

      document.addEventListener("scroll", function () {
        if (!spyTicking) { spyTicking = true; requestAnimationFrame(updateSpy); }
      }, { passive: true });
      if (heads.length) updateSpy(); // stato iniziale (anche se si arriva con un #ancora)

      // ---- Comandi copia/condividi sui titoli ----
      // Ricostruisce il markdown della sezione leggendo il DOM, così build.mjs
      // non deve duplicare il sorgente dentro la pagina.
      function inline(node) {
        if (node.nodeType === 3) return node.nodeValue;
        if (node.nodeType !== 1) return "";
        // ancora "#" e comandi del titolo non fanno parte del testo
        if (node.classList && (node.classList.contains("anchor") || node.classList.contains("head-tools"))) return "";
        var kids = Array.prototype.map.call(node.childNodes, inline).join("");
        var tag = node.tagName;
        if (tag === "STRONG" || tag === "B") return "**" + kids + "**";
        if (tag === "EM" || tag === "I") return "*" + kids + "*";
        if (tag === "CODE") return "`" + kids + "`";
        if (tag === "A") return "[" + kids + "](" + node.getAttribute("href") + ")";
        if (tag === "BR") return "\n";
        return kids;
      }
      function block(el) {
        var tag = el.tagName;
        if (/^H[2-6]$/.test(tag)) return "#".repeat(+tag[1]) + " " + inline(el).trim();
        if (tag === "P") return inline(el).trim();
        if (tag === "UL" || tag === "OL") {
          return Array.prototype.map.call(el.children, function (li, i) {
            return (tag === "OL" ? i + 1 + ". " : "- ") + inline(li).trim();
          }).join("\n");
        }
        if (tag === "PRE") return "```\n" + el.textContent.replace(/\n+$/, "") + "\n```";
        if (tag === "BLOCKQUOTE") return inline(el).trim().split("\n").map(function (l) { return "> " + l; }).join("\n");
        if (tag === "HR") return "---";
        var table = tag === "TABLE" ? el : el.querySelector && el.querySelector("table");
        if (table) {
          return Array.prototype.map.call(table.rows, function (r, i) {
            var cells = Array.prototype.map.call(r.cells, function (c) { return inline(c).trim(); });
            var row = "| " + cells.join(" | ") + " |";
            return i === 0 ? row + "\n|" + cells.map(function () { return "---"; }).join("|") + "|" : row;
          }).join("\n");
        }
        return inline(el).trim();
      }
      function sectionMarkdown(h) {
        var lvl = +h.tagName[1], parts = [block(h)], el = h.nextElementSibling;
        while (el) {
          if (/^H[1-6]$/.test(el.tagName) && +el.tagName[1] <= lvl) break;
          if (el.classList && el.classList.contains("chapter-kicker")) break;
          if (el.tagName === "FOOTER") break;
          var b = block(el);
          if (b) parts.push(b);
          el = el.nextElementSibling;
        }
        return parts.join("\n\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
      }
      function feedback(btn) {
        btn.classList.add("ok");
        setTimeout(function () { btn.classList.remove("ok"); }, 1600);
      }
      document.addEventListener("click", function (e) {
        var btn = e.target.closest && e.target.closest(".head-tool");
        if (!btn) return;
        e.preventDefault();
        var h = btn.closest("h2, h3");
        if (!h) return;
        var text = btn.getAttribute("data-tool") === "link"
          ? location.origin + location.pathname + "#" + h.id
          : sectionMarkdown(h);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { feedback(btn); });
        } else {
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); feedback(btn); } catch (err) {}
          document.body.removeChild(ta);
        }
      });
    })();
  </script>
</body>
</html>
